<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汇办 · 任务追踪台</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
 * design-systems/default/tokens.css
 *
 * Structured token bindings for "Neutral Modern" — the canonical
 * starter design system. This file is the *machine-readable* form of
 * the values described in `DESIGN.md`. Agents are expected to paste
 * the `:root { … }` block verbatim into the first `<style>` of every
 * artifact they generate against this design system, then reference
 * tokens via `var(--name)` from then on.
 *
 * Why this file exists:
 *   DESIGN.md gives humans context ("Accent #2F6FEB — primary CTAs"),
 *   but agents have to translate prose names like "Accent" into the
 *   standard token names the lint enforces (`--accent`). That
 *   translation is where token misuse happens. This file pre-translates
 *   the brand once, so agents copy structure instead of inventing it.
 *
 * Contract sources:
 *   - Standard token names: craft/color.md
 *       (--bg / --surface / --fg / --muted / --border / --accent
 *        / --success / --warn / --danger)
 *   - Display-face contract: craft/anti-ai-slop.md
 *       (--font-display, must be referenced via var())
 *   - Lint enforcement: apps/daemon/src/lint-artifact.ts
 *       (raw-hex >12 outside :root → P1; indigo laundering → P0)
 *
 * Schema notes (the shared schema grew from kami's stress test —
 * see design-systems/kami/tokens.css for the rich form, and the
 * #Gap N tags below for what each addition resolves):
 *   #Gap 1  — 4-level foreground ramp (fg / fg-2 / muted / meta)
 *   #Gap 2  — 3-level surface (bg / surface / surface-warm)
 *   #Gap 3  — 2-level border (border / border-soft)
 *   #Gap 4  — accent-hover binds to value, not formula
 *   #Gap 5  — ring elevation as a first-class level (--elev-ring)
 *
 * Default doesn't differentiate every level kami needs, so the
 * shallow tokens (`--fg-2`, `--meta`, `--surface-warm`, `--border-soft`)
 * collapse to their richer siblings via `var()`. The names still
 * exist so components can reference them uniformly across brands.
 *
 * Keep this file additive: never invent token names not also documented
 * in DESIGN.md or the craft contracts. New brands cloning this template
 * should overwrite values, not rename keys.
 * ─────────────────────────────────────────────────────────────────── */

:root {
  /* ─── Surface (3 levels — #Gap 2) ─────────────────────────────────
   * Per craft/color.md: never pure black, never pure white. Default
   * uses #FAFAFA for bg and #FFFFFF for surface — the cream-to-white
   * contrast gives cards lift without a shadow. `--surface-warm` is a
   * schema slot for brands that need a tertiary tier (kami's warm-sand
   * button bg); default has no third tier and aliases it to surface. */
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-warm: var(--surface);   /* alias — default has no warm tier */

  /* ─── Foreground ramp (4 levels — #Gap 1) ───────────────────────
   * Default differentiates only two text levels (primary + muted).
   * `--fg-2` and `--meta` are schema slots for brands with richer
   * ramps (kami uses near-black / dark-warm / olive / stone). They
   * alias here so components targeting the full ramp resolve. */
  --fg: #111111;
  --fg-2: var(--fg);                /* alias — default has no secondary tier */
  --muted: #6b6b6b;
  --meta: var(--muted);             /* alias — default has no metadata tier */

  /* ─── Border (2 levels — #Gap 3) ────────────────────────────────
   * Default has one border weight; `--border-soft` is a schema slot
   * for brands with row-separator vs card-edge differentiation. */
  --border: #e5e5e5;
  --border-soft: var(--border);     /* alias — default has no soft tier */

  /* ─── Accent ──────────────────────────────────────────────────────
   * Cobalt — primary CTAs, links, ONE hero element per screen.
   * Hard cap of 2 visible uses per screen is enforced by lint
   * (`accent-overuse` P1 fires at >6 inline occurrences). */
  --accent: #2f6feb;
  --accent-on: #ffffff; /* fg when accent is the bg (e.g. button label) */

  /* ─── Accent states (#Gap 4) ────────────────────────────────────
   * Hover and active variants for any element using --accent as bg.
   * Default's mid-luminance cobalt admits a black-mix formula
   * cleanly; that's a brand-specific binding, NOT a schema rule.
   * kami binds --accent-hover to var(--accent) (no color shift,
   * hover via elevation) because ink-blue is too dark for further
   * darkening to read; other brands with light accents must
   * hand-pick.
   *
   * Schema rule: every brand provides --accent-hover and
   * --accent-active. The binding strategy (formula / identity /
   * hand-picked) is brand-decided.
   *
   * Why these two are tokens (and other tints stay inline):
   *   - cross-component (button, chip, tab, dropdown all need them)
   *   - cross-mode reversal (dark-mode hover should mix white, not
   *     black — token re-binding is one line per mode)
   *   - cross-brand customization (formula breaks on light accents)
   *   - lint-enforceable contract (every brand must provide these)
   * Other inline `color-mix(...)` calls in components don't yet hit
   * any of the above — promote them to tokens when a second use
   * appears. */
  --accent-hover: color-mix(in oklab, var(--accent), black 8%);
  --accent-active: color-mix(in oklab, var(--accent), black 14%);

  /* ─── Semantic ────────────────────────────────────────────────────
   * Reserved for state, not decoration. Keep total semantic-color
   * pixels under 5% of the surface. */
  --success: #17a34a;
  --warn: #eab308;
  --danger: #dc2626;

  /* ─── Typography ──────────────────────────────────────────────────
   * Inter for display is the documented "modern minimal" override
   * to anti-ai-slop's serif-display rule (see DESIGN.md
   * §Visual Theme & Atmosphere — "Calm, functional, quietly
   * confident"). Other brands should rebind --font-display to a
   * serif unless their direction is also tech/utility. */
  --font-display: "Inter", -apple-system, system-ui, sans-serif;
  --font-body: "Inter", -apple-system, system-ui, sans-serif;
  --font-mono: ui-monospace, "JetBrains Mono", monospace;

  /* Type scale (px) — direct copy of DESIGN.md §Typography Rules */
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 20px;
  --text-xl: 24px;
  --text-2xl: 32px;
  --text-3xl: 48px;
  --text-4xl: 64px;

  --leading-body: 1.5;
  --leading-tight: 1.2;
  --tracking-display: -0.01em; /* applied to display sizes ≥32px */

  /* ─── Spacing ─────────────────────────────────────────────────────
   * 4px base unit. Section rhythm (80/48/32) lives below as named
   * tokens because DESIGN.md §Layout Principles treats them as
   * breakpoint-specific decisions, not generic spacing. */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --space-20: 80px;

  --section-y-desktop: 80px;
  --section-y-tablet: 48px;
  --section-y-phone: 32px;

  /* ─── Radius ──────────────────────────────────────────────────────
   * Two intents: small (button/input) and medium (card/modal).
   * `--radius-pill` reserved for chips/avatars; do not use it on
   * cards or buttons. */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 9999px;

  /* ─── Elevation (3 levels — #Gap 5) ─────────────────────────────
   * Default uses two levels (flat + raised blur shadow) per its own
   * DESIGN.md §Depth & Elevation. The schema gains `--elev-ring` as
   * a first-class level so brands using ring shadows as primary
   * elevation (kami, paper, editorial) don't need to rebind
   * --elev-raised away from blur. Default declares all three; ring
   * is available for hairline edges where a 1px border would shift
   * layout. No fourth level — that's neumorphism territory. */
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 2px 8px color-mix(in oklab, var(--fg), transparent 92%);

  /* ─── Focus ring ──────────────────────────────────────────────────
   * Single source of truth for keyboard-focus indicators. Every
   * `:focus-visible` rule on buttons, inputs, links, and tabs must
   * use this token — uniform behavior is itself a brand signal, and
   * craft/accessibility-baseline.md treats focus visibility as a
   * non-negotiable. Implemented as a `box-shadow` so it layers
   * outside the element without affecting layout. */
  --focus-ring: 0 0 0 3px color-mix(in oklab, var(--accent), transparent 70%);

  /* ─── Motion ──────────────────────────────────────────────────────
   * Two durations + one easing curve, per anti-ai-slop's "short,
   * purposeful transitions (150–250ms) with stable easing". Add a
   * third duration only when a real interaction needs it; do not
   * invent `--motion-slow` speculatively. */
  --motion-fast: 150ms;            /* hover, focus, micro-states */
  --motion-base: 200ms;            /* general state changes */
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);

  /* ─── Layout ──────────────────────────────────────────────────────
   * Container width and per-breakpoint gutter. Skill-side responsive
   * code reads these to decide grid columns. */
  --container-max: 1200px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet: 16px;
  --container-gutter-phone: 12px;
}

/* ============ base ============ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  font-size: var(--text-sm);
  line-height: var(--leading-body);
  color: var(--fg);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }
svg { display: block; }
.hidden { display: none !important; }

/* ============ buttons ============ */
.btn-primary, .btn-secondary, .icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: 44px; padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm); font-weight: 500;
  border: 1px solid transparent;
  transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.btn-primary { background: var(--accent); color: var(--accent-on); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { background: var(--accent-active); }
.btn-secondary { background: transparent; color: var(--fg); border-color: var(--border); }
.btn-secondary:hover { border-color: var(--muted); }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: var(--text-xs); }
.btn-primary:focus-visible, .btn-secondary:focus-visible, .icon-btn:focus-visible,
.chip:focus-visible, .menu-item:focus-visible, .card:focus-visible, .step:focus-visible,
.link:focus-visible, .select-btn:focus-visible, .switch:focus-visible, .advance:focus-visible,
.seg-btn:focus-visible, .mini-btn:focus-visible, .sortable:focus-visible {
  outline: none; box-shadow: var(--focus-ring);
}
.icon-btn {
  min-height: 44px; min-width: 44px; padding: 0;
  background: transparent; color: var(--fg); border-color: transparent;
  position: relative;
}
.icon-btn:hover { background: color-mix(in oklab, var(--fg), transparent 94%); }
.icon-btn svg { width: 20px; height: 20px; }
.link { color: var(--accent); background: none; border: none; padding: 0; font-size: var(--text-sm); }
.link:hover { text-decoration: underline; }

/* ============ topbar ============ */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  height: 64px; padding: 0 var(--space-6);
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: var(--space-3); }
.logo {
  width: 30px; height: 30px; border-radius: var(--radius-sm);
  background: var(--accent); color: var(--accent-on);
  display: grid; place-items: center;
}
.logo svg { width: 16px; height: 16px; }
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: var(--text-base); letter-spacing: -0.01em; }
.template-switch { position: relative; margin-left: var(--space-2); }
.select-btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  height: 44px; padding: 0 var(--space-4);
  background: var(--surface); color: var(--fg);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: var(--text-sm); font-weight: 500;
}
.select-btn:hover { border-color: var(--muted); }
.select-btn svg { width: 16px; height: 16px; color: var(--muted); }
.menu {
  position: absolute; top: calc(100% + 6px); left: 0; min-width: 260px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  box-shadow: var(--elev-raised); padding: var(--space-2); z-index: 50;
  max-height: 70vh; overflow-y: auto;
}
.menu-section {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
  color: var(--muted); text-transform: uppercase; padding: var(--space-2) var(--space-3) var(--space-1);
}
.menu-row { display: flex; align-items: stretch; }
.menu-item {
  display: flex; flex-direction: column; gap: 2px; flex: 1;
  width: auto; text-align: left; padding: var(--space-3);
  background: transparent; border: none; border-radius: var(--radius-sm);
}
.menu-item:hover { background: color-mix(in oklab, var(--fg), transparent 95%); }
.menu-item.active { background: color-mix(in oklab, var(--accent), transparent 92%); }
.menu-item .mi-name { font-size: var(--text-sm); font-weight: 500; color: var(--fg); }
.menu-item .mi-sub { font-size: var(--text-xs); color: var(--muted); }
.menu-item.active .mi-name { color: var(--accent); }
.mi-custom { font-size: 11px; font-weight: 500; color: var(--accent); border: 1px solid color-mix(in oklab, var(--accent), transparent 70%); border-radius: var(--radius-pill); padding: 1px 7px; margin-left: 4px; }
.mi-del {
  flex: none; width: 36px; border: none; background: transparent; color: var(--muted);
  border-radius: var(--radius-sm); font-size: var(--text-base);
}
.mi-del:hover { color: var(--danger); background: color-mix(in oklab, var(--danger), transparent 92%); }
.menu-add { padding: var(--space-2) var(--space-1) var(--space-1); border-top: 1px solid var(--border-soft); margin-top: var(--space-1); }

.topbar-actions { display: flex; align-items: center; gap: var(--space-2); }
.search {
  display: flex; align-items: center; gap: var(--space-2);
  height: 44px; padding: 0 var(--space-3);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--muted);
}
.search:focus-within { border-color: var(--accent); box-shadow: var(--focus-ring); }
.search svg { width: 18px; height: 18px; }
.search input { border: none; outline: none; background: transparent; color: var(--fg); font-size: var(--text-sm); width: 160px; }
.search input::placeholder { color: var(--muted); }
.badge-count {
  position: absolute; top: 4px; right: 4px;
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: var(--radius-pill);
  background: var(--danger); color: var(--accent-on);
  font-size: 11px; font-weight: 600; line-height: 18px; text-align: center;
}

/* ============ meta bar ============ */
.meta-bar {
  max-width: var(--container-max); margin: 0 auto;
  padding: var(--space-6) var(--space-6) 0;
  display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-6);
  flex-wrap: wrap;
}
.eyebrow { font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.04em; color: var(--muted); text-transform: uppercase; margin: 0 0 var(--space-2); }
.meta-title { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: var(--text-xl); letter-spacing: -0.01em; line-height: var(--leading-tight); }
.meta-desc { margin: var(--space-2) 0 0; color: var(--muted); font-size: var(--text-sm); max-width: 560px; }
.meta-right { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-2); }
.kw-row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; justify-content: flex-end; }
.kw-label { font-size: var(--text-xs); color: var(--muted); }
.keyword-chips { display: flex; gap: var(--space-1); flex-wrap: wrap; }
.kw {
  font-family: var(--font-mono); font-size: var(--text-xs);
  padding: 2px 8px; border-radius: var(--radius-pill);
  background: color-mix(in oklab, var(--accent), transparent 92%);
  color: var(--accent); border: 1px solid color-mix(in oklab, var(--accent), transparent 78%);
}
.switch-row { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--muted); }
.switch {
  position: relative; width: 36px; height: 20px; border-radius: var(--radius-pill);
  background: var(--border); cursor: pointer; transition: background var(--motion-fast) var(--ease-standard);
  flex: none; display: inline-block;
}
.switch[aria-checked="true"] { background: var(--accent); }
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%; background: var(--surface);
  transition: transform var(--motion-fast) var(--ease-standard);
}
.switch[aria-checked="true"]::after { transform: translateX(16px); }

/* ============ filter bar ============ */
.filter-bar {
  max-width: var(--container-max); margin: 0 auto;
  padding: var(--space-4) var(--space-6) 0;
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  flex-wrap: wrap;
}
.filter-left { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: color-mix(in oklab, var(--fg), transparent 94%); border-radius: var(--radius-sm); }
.seg-btn {
  height: 38px; padding: 0 var(--space-4); border: none; border-radius: var(--radius-sm);
  background: transparent; color: var(--muted); font-size: var(--text-sm); font-weight: 500;
}
.seg-btn.active { background: var(--surface); color: var(--fg); box-shadow: var(--elev-raised); }
.filter-chips { display: flex; gap: var(--space-2); }
.chip {
  height: 44px; padding: 0 var(--space-4);
  border-radius: var(--radius-pill);
  background: transparent; color: var(--muted);
  border: 1px solid var(--border); font-size: var(--text-sm); font-weight: 500;
}
.chip:hover { color: var(--fg); border-color: var(--muted); }
.chip.active { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.count-label { font-size: var(--text-xs); color: var(--muted); font-family: var(--font-mono); }

/* ============ board ============ */
.board {
  max-width: var(--container-max); margin: 0 auto;
  padding: var(--space-4) var(--space-6) var(--space-12);
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(224px, 1fr);
  gap: var(--space-4); align-items: start; overflow-x: auto;
}
.column { display: flex; flex-direction: column; gap: var(--space-3); }
.col-head { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.terminal { background: var(--success); }
.col-name { font-weight: 600; font-size: var(--text-sm); }
.col-count {
  font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted);
  margin-left: auto; padding: 1px 8px; border-radius: var(--radius-pill); background: color-mix(in oklab, var(--fg), transparent 93%);
}
.col-empty {
  border: 1px dashed var(--border); border-radius: var(--radius-md);
  padding: var(--space-6) var(--space-4); text-align: center;
  color: var(--muted); font-size: var(--text-xs);
}
.card {
  display: flex; flex-direction: column; gap: var(--space-3);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--space-4); text-align: left; width: 100%;
  transition: box-shadow var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
}
.card:hover { box-shadow: var(--elev-raised); border-color: color-mix(in oklab, var(--accent), transparent 60%); }
.card-title { display: block; font-size: var(--text-sm); font-weight: 600; color: var(--fg); line-height: var(--leading-tight); margin: 0; }
.card-desc { font-size: var(--text-xs); color: var(--muted); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-meta { display: flex; align-items: center; gap: var(--space-2); }
.card-meta .due { margin-left: auto; }
.src-badge {
  font-family: var(--font-mono); font-size: 11px; line-height: 1;
  padding: 3px 7px; border-radius: var(--radius-pill);
  background: color-mix(in oklab, var(--fg), transparent 93%); color: var(--muted);
  border: 1px solid var(--border-soft);
}
.src-badge.mail { color: var(--accent); background: color-mix(in oklab, var(--accent), transparent 92%); border-color: color-mix(in oklab, var(--accent), transparent 78%); }
.src-badge.excel { color: var(--success); background: color-mix(in oklab, var(--success), transparent 92%); border-color: color-mix(in oklab, var(--success), transparent 78%); }
.pri-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: 11px; line-height: 1; font-weight: 500;
  padding: 3px 7px; border-radius: var(--radius-pill);
}
.pri-badge .pri-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.pri-urgent { background: color-mix(in oklab, var(--danger), transparent 90%); color: var(--danger); border: 1px solid color-mix(in oklab, var(--danger), transparent 70%); }
.pri-urgent .pri-dot { background: var(--danger); }
.pri-high { background: color-mix(in oklab, var(--warn), transparent 88%); color: color-mix(in oklab, var(--warn), black 38%); border: 1px solid color-mix(in oklab, var(--warn), transparent 70%); }
.pri-high .pri-dot { background: var(--warn); }
.pri-normal { background: color-mix(in oklab, var(--fg), transparent 93%); color: var(--muted); border: 1px solid var(--border-soft); }
.pri-normal .pri-dot { background: var(--muted); }
.card-footer { display: flex; align-items: center; gap: var(--space-2); margin-top: auto; }
.avatar {
  width: 26px; height: 26px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-size: var(--text-xs); font-weight: 600;
  background: color-mix(in oklab, var(--fg), transparent 90%); color: var(--fg);
  border: 1px solid var(--border);
}
.avatar.self { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }

      tasks: [
        { id: "s1", title: "新询价：办公家具一批", desc: "客户邮件询价 40 套工位家具，需本周内出报价。", source: "mail", publisher: "我", handler: "我", priority: "high", due: "2026-08-21", status: 0, log: [] },
        { id: "s2", title: "回访客户 A 需求", desc: "客户 A 之前提到扩容，回访确认具体数量和预算。", source: "manual", publisher: "李姐", handler: "李姐", priority: "normal", due: "2026-08-22", status: 1, log: [{ actor: "李姐", from: "新线索", to: "已联系", time: "昨天 14:10" }] },
        { id: "s3", title: "发报价单给客户 B", desc: "按 Excel 里的成本表重新核算，发正式报价单。", source: "manual", publisher: "陈工", handler: "李姐", priority: "urgent", due: "2026-08-23", status: 2, log: [{ actor: "陈工", from: "已联系", to: "报价中", time: "10:05" }] },
        { id: "s4", title: "合同签署跟进", desc: "客户 B 口头同意，等法务回传盖章合同。", source: "mail", publisher: "我", handler: "我", priority: "high", due: "2026-08-26", status: 3, log: [{ actor: "我", from: "报价中", to: "已签约", time: "11:30" }] }
      ],
      inbox: [
        { id: "si1", from: "客户 · 刘", subject: "询价：会议室改造", snippet: "想了解一下会议室改造的报价，方便约个时间电话聊吗？", keyword: "询价", suggestStatus: 0 }
      ]
    }
  };

  const SOURCE_LABEL = { mail: "邮件", excel: "Excel", manual: "手动" };
  const LS_TEMPLATES = "huiban.templates.v3";
  const LS_STATE = "huiban.state.v2";

  /* ── 可变的模板集（预设 + 自定义），持久化 ── */
  function loadTemplates() {
    try { const raw = localStorage.getItem(LS_TEMPLATES); if (raw) { const p = JSON.parse(raw); if (p && Object.keys(p).length) { migrate(p); return p; } } } catch (e) {}
    return JSON.parse(JSON.stringify(SEED));
  }
  /* 兼容旧数据：把旧的 assignee 映射为 publisher，补齐 handler/priority */
  function migrate(templates) {
    Object.keys(templates).forEach((tid) => {
      const t = templates[tid];
      (t.tasks || []).forEach((task) => {
        if (!task.publisher && task.assignee) { task.publisher = task.assignee; delete task.assignee; }
        if (!task.publisher) task.publisher = "我";
        if (!task.handler) task.handler = task.publisher;
        if (!task.priority) task.priority = "normal";
      });
    });
  }
  function persistTemplates() { try { localStorage.setItem(LS_TEMPLATES, JSON.stringify(TEMPLATES)); } catch (e) {} }
  function persistState() { try { localStorage.setItem(LS_STATE, JSON.stringify({ templateId: state.templateId, view: state.view })); } catch (e) {} }

  const TEMPLATES = loadTemplates();
  let state = { templateId: "general", filter: "all", query: "", view: "board", sort: { key: null, dir: 1 }, modalMode: "view", modalTaskId: null };
  try { const s = JSON.parse(localStorage.getItem(LS_STATE)); if (s) Object.assign(state, { templateId: s.templateId || "general", view: s.view || "board" }); } catch (e) {}
  if (!TEMPLATES[state.templateId]) state.templateId = "general";

  let editDraft = null;

  const $ = (sel) => document.querySelector(sel);
  const tpl = () => TEMPLATES[state.templateId];
  const isCustom = (id) => id.indexOf("custom-") === 0;

  /* ── 工具 ── */
  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function fmtDue(d) { if (!d) return ""; if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d.slice(5); return d; }
  function dueSortVal(d) { return d === "今天" ? "0000-00-00" : (d || ""); }
  function nowTime() { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function findTask(id) { return tpl().tasks.find((t) => t.id === id); }
  function assigneeOf(name) { return TEAM.find((m) => m.name === name) || TEAM[0]; }

  function avatarHtml(name, extraClass) {
    const m = assigneeOf(name);
    return '<span class="avatar ' + (m.self ? "self" : "") + (extraClass ? " " + extraClass : "") + '" title="' + esc(m.name) + '">' + esc(m.initial) + "</span>";
  }
  function srcBadge(source) { return '<span class="src-badge ' + source + '">' + SOURCE_LABEL[source] + "</span>"; }
  function priBadge(p) {
    const cls = p === "urgent" ? "pri-urgent" : (p === "high" ? "pri-high" : "pri-normal");
    const label = PRIORITY[p] ? PRIORITY[p].label : "普通";
    return '<span class="pri-badge ' + cls + '"><span class="pri-dot"></span>' + label + "</span>";
  }
  function icon(name) {
    const paths = {
      clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
      check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
      arrow: '<path d="M9 6l6 6-6 6"/>',
      close: '<path d="M6 6l12 12M18 6L6 18"/>',
      trash: '<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/>'
    };
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + paths[name] + "</svg>";
  }

  /* ── 筛选 + 排序 ── */
  function visibleTasks() {
    const q = state.query.trim().toLowerCase();
    return tpl().tasks.filter((t) => {
      if (state.filter !== "all" && t.source !== state.filter) return false;
      if (q && !(t.title + " " + t.desc).toLowerCase().includes(q)) return false;
      return true;
    });
  }
  function sortTasks(tasks) {
    const { key, dir } = state.sort;
    if (!key) return tasks;
    return tasks.slice().sort((a, b) => {
      if (key === "title") return dir * a.title.localeCompare(b.title, "zh");
      if (key === "status") return (a.status - b.status) * dir;
      if (key === "priority") return ((PRIORITY[a.priority] ? PRIORITY[a.priority].rank : 2) - (PRIORITY[b.priority] ? PRIORITY[b.priority].rank : 2)) * dir;
      if (key === "due") { const va = dueSortVal(a.due), vb = dueSortVal(b.due); return (va < vb ? -1 : va > vb ? 1 : 0) * dir; }
      return 0;
    });
  }
  function toggleSort(key) {
    if (state.sort.key === key) state.sort.dir *= -1; else state.sort = { key: key, dir: 1 };
    renderView();
  }
  function sortArrow(key) { return state.sort.key === key ? '<span class="sort-ind">' + (state.sort.dir === 1 ? " ↑" : " ↓") + "</span>" : ""; }

  /* ── 看板视图 ── */
  function renderBoard() {
    const board = $("#board");
    const statuses = tpl().statuses;
    const tasks = visibleTasks();
    let html = "";
    statuses.forEach((s, i) => {
      const inCol = tasks.filter((t) => t.status === i);
      const isLast = i === statuses.length - 1;
      html += '<section class="column" data-od-id="column-' + i + '">';
      html += '<div class="col-head"><span class="dot' + (isLast ? " terminal" : "") + '"></span><span class="col-name">' + esc(s) + '</span><span class="col-count">' + inCol.length + "</span></div>";
      if (inCol.length === 0) {
        html += '<div class="col-empty">暂无任务</div>';
      } else {
        inCol.forEach((t) => {
          html += '<button class="card" data-od-id="task-card-' + t.id + '" data-id="' + t.id + '">';
          html += '<div class="card-meta">' + srcBadge(t.source) + priBadge(t.priority) + '<span class="due">' + icon("clock") + esc(fmtDue(t.due)) + "</span></div>";
          html += '<span class="card-title">' + esc(t.title) + "</span>";
          html += '<span class="card-desc">' + esc(t.desc) + "</span>";
          html += '<div class="card-footer">' + avatarHtml(t.handler) + '<span class="holder-name">' + esc(t.handler) + '</span><span class="pub">发布·' + esc(t.publisher) + "</span>"
            + (isLast ? '<span class="advance done" title="已完成">' + icon("check") + "</span>" : '<span class="advance" title="推进到下一状态" data-advance="' + t.id + '">' + icon("arrow") + "</span>") + "</div>";
          html += "</button>";
        });
      }
      html += "</section>";
    });
    board.innerHTML = html;
    $("#countLabel").textContent = tasks.length + " 项任务 · " + statuses.length + " 个状态";
  }

  /* ── 表格视图（Excel 式） ── */
  function renderTable() {
    const board = $("#board");
    const t = tpl();
    const tasks = sortTasks(visibleTasks());
    let html = '<div class="table-wrap" data-od-id="table-view"><table class="task-table"><thead><tr>'
      + '<th class="sortable" data-sort="title" tabindex="0">任务' + sortArrow("title") + "</th>"
      + '<th class="sortable" data-sort="priority" tabindex="0">重要性' + sortArrow("priority") + "</th>"
      + "<th>来源</th>"
      + "<th>发布者</th>"
      + "<th>处理者</th>"
      + '<th class="sortable" data-sort="status" tabindex="0">状态' + sortArrow("status") + "</th>"
      + '<th class="sortable" data-sort="due" tabindex="0">截止' + sortArrow("due") + "</th>"
      + "</tr></thead><tbody>";
    if (tasks.length === 0) {
      html += '<tr><td colspan="7" class="table-empty">没有匹配的任务</td></tr>';
    } else {
      tasks.forEach((task) => {
        html += '<tr data-id="' + task.id + '" data-od-id="table-row-' + task.id + '">'
          + '<td><span class="table-title">' + esc(task.title) + '</span><span class="table-desc">' + esc(task.desc) + "</span></td>"
          + "<td>" + priBadge(task.priority) + "</td>"
          + "<td>" + srcBadge(task.source) + "</td>"
          + '<td class="td-pub">' + esc(task.publisher) + "</td>"
          + '<td class="td-assignee">' + avatarHtml(task.handler) + '<span class="td-name">' + esc(task.handler) + "</span></td>"
          + '<td><select class="status-select" data-id="' + task.id + '" aria-label="状态">' + t.statuses.map((s, i) => '<option value="' + i + '"' + (i === task.status ? " selected" : "") + ">" + esc(s) + "</option>").join("") + "</select></td>"
          + '<td class="td-due">' + esc(fmtDue(task.due)) + "</td>"
          + "</tr>";
      });
    }
    html += "</tbody></table></div>";
    board.innerHTML = html;
    $("#countLabel").textContent = tasks.length + " 项任务 · " + t.statuses.length + " 个状态";
  }

  function renderView() { if (state.view === "table") renderTable(); else renderBoard(); }

  /* ── 模板元信息 ── */
  function renderMeta() {
    const t = tpl();
    $("#templateTitle").textContent = t.name;
    $("#templateDesc").textContent = t.desc;
    $("#templateBtnLabel").textContent = t.name;
    const chips = $("#keywordChips");
    chips.innerHTML = t.keywords.length ? t.keywords.map((k) => '<span class="kw">' + esc(k) + "</span>").join("") : '<span class="kw-empty" style="color:var(--muted);font-size:var(--text-xs)">（暂无关键词，可点「编辑模板」添加）</span>';
  }

  function renderMenu() {
    const menu = $("#templateMenu");
    const presetIds = Object.keys(SEED);
    const customIds = Object.keys(TEMPLATES).filter(isCustom);
    let html = '<div class="menu-section">预设模板</div>';
    presetIds.forEach((id) => { html += menuItem(id, false); });
    if (customIds.length) {
      html += '<div class="menu-section">自定义模板</div>';
      customIds.forEach((id) => { html += menuItem(id, true); });
    }
    html += '<div class="menu-add"><button class="btn-secondary btn-sm" id="newTemplateBtn" style="width:100%;justify-content:center;">+ 新建自定义模板</button></div>';
    menu.innerHTML = html;
  }
  function menuItem(id, custom) {
    const t = TEMPLATES[id];
    const active = id === state.templateId ? " active" : "";
    return '<div class="menu-row">'
      + '<button class="menu-item' + active + '" data-tpl="' + id + '" role="menuitem">'
      + '<span class="mi-name">' + esc(t.name) + (custom ? '<span class="mi-custom">自定义</span>' : "") + "</span>"
      + '<span class="mi-sub">' + esc(t.statuses.length) + " 个状态 · " + esc(t.keywords.length) + " 个关键词</span></button>"
      + (custom ? '<button class="mi-del" data-del="' + id + '" aria-label="删除模板" title="删除模板">×</button>' : "")
      + "</div>";
  }

  /* ── 模板编辑器 ── */
  function openTemplateEditor() {
    const t = tpl();
    editDraft = { name: t.name, desc: t.desc, statuses: t.statuses.slice(), keywords: t.keywords.slice() };
    const m = $("#templateModal");
    m.innerHTML =
      '<div class="modal-head"><div><h2 class="modal-title">编辑模板</h2><p class="modal-sub">改状态字词和关键词，贴合你的工作习惯</p></div>'
      + '<button class="icon-btn" id="tmplClose" aria-label="关闭">' + icon("close") + "</button></div>"
      + '<div class="modal-body">'
      + '<div class="field"><label for="tmplName">模板名称</label><input id="tmplName" type="text" value="' + esc(editDraft.name) + '"></div>'
      + '<div class="field"><label>状态流水线</label><div class="status-editor" id="statusList"></div><button class="btn-secondary btn-sm" id="addStatus" style="align-self:flex-start;">+ 添加状态</button><span class="field-help">上下拖动顺序即状态流转顺序；改字词会同步到看板和表格。</span></div>'
      + '<div class="field"><label>关键词（邮件命中即自动收任务）</label><div class="kw-editor"><div class="kw-list" id="kwList"></div><input id="kwInput" type="text" placeholder="输入关键词，回车添加"></div></div>'
      + "</div>"
      + '<div class="modal-foot"><span></span><div style="display:flex;gap:var(--space-2)"><button class="btn-secondary" id="tmplCancel">取消</button><button class="btn-primary" id="tmplSave">保存模板</button></div></div>';
    $("#templateOverlay").classList.remove("hidden");
    $("#templateModal").classList.remove("hidden");
    renderStatusList();
    renderKeywordList();

    $("#tmplClose").addEventListener("click", closeTemplateEditor);
    $("#tmplCancel").addEventListener("click", closeTemplateEditor);
    $("#tmplName").addEventListener("input", (e) => { editDraft.name = e.target.value; });
    $("#addStatus").addEventListener("click", () => { editDraft.statuses.push("新状态"); renderStatusList(); });
    $("#kwInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { const v = e.target.value.trim(); if (v && editDraft.keywords.indexOf(v) < 0) { editDraft.keywords.push(v); renderKeywordList(); } e.target.value = ""; e.preventDefault(); }
    });
    $("#tmplSave").addEventListener("click", saveTemplateEditor);
  }
  function renderStatusList() {
    const el = $("#statusList");
    el.innerHTML = editDraft.statuses.map((s, i) =>
      '<div class="status-row">'
      + '<input class="status-input" data-idx="' + i + '" value="' + esc(s) + '" aria-label="状态 ' + (i + 1) + '">'
      + '<button class="mini-btn" data-up="' + i + '"' + (i === 0 ? " disabled" : "") + ' title="上移">↑</button>'
      + '<button class="mini-btn" data-down="' + i + '"' + (i === editDraft.statuses.length - 1 ? " disabled" : "") + ' title="下移">↓</button>'
      + '<button class="mini-btn danger" data-del="' + i + '" title="删除">×</button>'
      + "</div>").join("");
    el.querySelectorAll(".status-input").forEach((inp) => inp.addEventListener("input", (e) => { editDraft.statuses[+e.target.dataset.idx] = e.target.value; }));
    el.querySelectorAll("[data-up]").forEach((b) => b.addEventListener("click", () => { const i = +b.dataset.up; const tmp = editDraft.statuses[i - 1]; editDraft.statuses[i - 1] = editDraft.statuses[i]; editDraft.statuses[i] = tmp; renderStatusList(); }));
    el.querySelectorAll("[data-down]").forEach((b) => b.addEventListener("click", () => { const i = +b.dataset.down; const tmp = editDraft.statuses[i + 1]; editDraft.statuses[i + 1] = editDraft.statuses[i]; editDraft.statuses[i] = tmp; renderStatusList(); }));
    el.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => { editDraft.statuses.splice(+b.dataset.del, 1); renderStatusList(); }));
  }
  function renderKeywordList() {
    const el = $("#kwList");
    el.innerHTML = editDraft.keywords.length
      ? editDraft.keywords.map((k, i) => '<span class="kw-tag">' + esc(k) + '<button class="kw-remove" data-kw="' + i + '" aria-label="移除">×</button></span>').join("")
      : '<span class="kw-empty">还没有关键词</span>';
    el.querySelectorAll(".kw-remove").forEach((b) => b.addEventListener("click", () => { editDraft.keywords.splice(+b.dataset.kw, 1); renderKeywordList(); }));
  }
  function saveTemplateEditor() {
    const name = editDraft.name.trim();
    if (!name) { toast("请填写模板名称"); return; }
    if (editDraft.statuses.filter((s) => s.trim()).length < 2) { toast("至少需要 2 个状态"); return; }
    const t = tpl();
    t.name = name;
    t.desc = editDraft.desc.trim() || "自定义模板";
    t.statuses = editDraft.statuses.map((s) => s.trim()).filter(Boolean);
    t.keywords = editDraft.keywords.slice();
    t.tasks.forEach((task) => { task.status = Math.min(task.status, t.statuses.length - 1); });
    persistTemplates();
    closeTemplateEditor();
    renderAll();
    toast("模板已更新");
  }
  function closeTemplateEditor() { $("#templateOverlay").classList.add("hidden"); $("#templateModal").classList.add("hidden"); $("#templateModal").innerHTML = ""; }

  function createCustomTemplate() {
    const id = "custom-" + Date.now();
    TEMPLATES[id] = { name: "未命名模板", desc: "自定义模板", statuses: ["待处理", "进行中", "已完成"], keywords: [], tasks: [], inbox: [] };
    state.templateId = id;
    persistTemplates(); persistState();
    $("#templateMenu").classList.add("hidden");
    $("#templateBtn").setAttribute("aria-expanded", "false");
    renderAll();
    openTemplateEditor();
  }
  function deleteTemplate(id) {
    delete TEMPLATES[id];
    if (state.templateId === id) state.templateId = "general";
    persistTemplates(); persistState();
    renderAll();
    toast("模板已删除");
  }

  /* ── 收件箱 ── */
  function renderInbox() {
    const drafts = tpl().inbox;
    $("#inboxBadge").textContent = drafts.length;
    $("#inboxBadge").classList.toggle("hidden", drafts.length === 0);
    const body = $("#inboxBody");
    if (drafts.length === 0) {
      body.innerHTML = '<p style="color:var(--muted);font-size:var(--text-sm);text-align:center;padding:var(--space-12) 0;">收件箱已清空。<br>新的命中邮件会自动出现在这里。</p>';
      return;
    }
    body.innerHTML = drafts.map((d) => {
      return '<div class="draft" data-od-id="draft-' + d.id + '">'
        + '<div class="draft-route"><span class="kw">' + esc(d.keyword) + '</span><span class="draft.from">' + esc(d.from) + "</span></div>"
        + '<p class="draft subject">' + esc(d.subject) + "</p>"
        + '<p class="draft snippet">' + esc(d.snippet) + "</p>"
        + '<div class="draft-route"><span style="color:var(--muted)">建议状态</span><b>' + esc(tpl().statuses[d.suggestStatus] || tpl().statuses[0]) + "</b></div>"
        + '<div class="draft-actions">'
        + '<button class="btn-secondary" data-ignore="' + d.id + '">忽略</button>'
        + '<button class="btn-primary" data-confirm="' + d.id + '">确认入板</button>'
        + "</div></div>";
    }).join("");
  }
  function confirmDraft(id) {
    const t = tpl();
    const idx = t.inbox.findIndex((d) => d.id === id);
    if (idx < 0) return;
    const d = t.inbox[idx];
    const s = Math.min(d.suggestStatus, t.statuses.length - 1);
    t.tasks.push({ id: d.id + "-" + Date.now(), title: d.subject.replace(/^(回复|跟进|Re:|询价)[：:]\s*/, ""), desc: d.snippet, source: "mail", publisher: "我", handler: "我", priority: "normal", due: "今天", status: s, log: [{ actor: "系统", from: "收件箱", to: t.statuses[s], time: nowTime() }] });
    t.inbox.splice(idx, 1);
    persistTemplates();
    toast("已按关键词「" + d.keyword + "」入板：" + t.statuses[s]);
    renderAll();
  }
  function ignoreDraft(id) {
    const t = tpl();
    t.inbox = t.inbox.filter((d) => d.id !== id);
    persistTemplates();
    toast("已忽略该邮件");
    renderAll();
  }

  /* ── 任务详情 / 新建 ── */
  function renderTaskModal() {
    const t = tpl();
    const isNew = state.modalMode === "create";
    const task = isNew ? null : findTask(state.modalTaskId);
    const m = $("#taskModal");
    if (!task && !isNew) { closeModal(); return; }

    const statuses = t.statuses;
    const cur = task ? task.status : 0;
    const stepper = statuses.map((s, i) => {
      const cls = i === cur ? "current" : (i < cur ? "done" : "");
      const conn = i < statuses.length - 1 ? '<span class="step-connector"></span>' : "";
      return '<button class="step ' + cls + '" data-step="' + i + '"><span class="step-idx">' + (i < cur ? "✓" : i + 1) + "</span>" + esc(s) + "</button>" + conn;
    }).join("");

    const logHtml = task && task.log.length
      ? task.log.map((l) => '<div class="log-item">' + avatarHtml(l.actor) + '<span class="log-body"><b>' + esc(l.actor) + "</b> 将状态从 <b>" + esc(l.from) + "</b> 改为 <b>" + esc(l.to) + '</b></span><span class="log-time">' + esc(l.time) + "</span></div>").join("")
      : '<div class="log-item"><span class="log-body">还没有协同记录。推进状态后会记录在这里。</span></div>';

    function personSelect(id, val) {
      return '<select id="' + id + '">' + TEAM.map((mm) => '<option value="' + mm.name + '"' + (val === mm.name ? " selected" : "") + ">" + esc(mm.name) + "</option>").join("") + "</select>";
    }

    m.innerHTML =
      '<div class="modal-head">'
      + '<div><h2 class="modal-title">' + (isNew ? "新建任务" : esc(task.title)) + '</h2>'
      + '<p class="modal-sub">' + (isNew ? "手动新建，也可以从收件箱或 Excel 导入" : srcBadge(task.source) + " · 发布 " + esc(task.publisher)) + "</p></div>"
      + '<button class="icon-btn" id="modalClose" aria-label="关闭">' + icon("close") + "</button></div>"
      + '<div class="modal-body">'
      + '<div class="field"><label>状态</label><div class="stepper" data-od-id="stepper">' + stepper + "</div></div>"
      + '<div class="field" id="titleField"><label for="fTitle">任务标题</label><input id="fTitle" type="text" placeholder="例如：跟进客户报价" value="' + (task ? esc(task.title) : "") + '"><span class="error-msg hidden">请填写任务标题</span></div>'
      + '<div class="field"><label for="fDesc">描述</label><textarea id="fDesc" placeholder="补充背景、链接或备注">' + (task ? esc(task.desc) : "") + "</textarea></div>"
      + '<div class="field-row"><div class="field"><label for="fPublisher">发布者</label>' + personSelect("fPublisher", task ? task.publisher : "我") + "</div>"
      + '<div class="field"><label for="fHandler">处理者</label>' + personSelect("fHandler", task ? task.handler : "我") + "</div></div>"
      + '<div class="field-row"><div class="field"><label for="fPriority">重要性</label><select id="fPriority"><option value="urgent"' + (task && task.priority === "urgent" ? " selected" : "") + ">紧急</option><option value=\"high\"" + (task && task.priority === "high" ? " selected" : "") + ">重要</option><option value=\"normal\"" + (!task || (task.priority !== "urgent" && task.priority !== "high") ? " selected" : "") + ">普通</option></select></div>"
      + '<div class="field"><label for="fDue">截止日期</label><input id="fDue" type="date" value="' + (task && /^\d{4}-\d{2}-\d{2}$/.test(task.due) ? esc(task.due) : "") + '"></div></div>'
      + (task ? '<div class="field"><label>协同记录</label><div class="log" data-od-id="activity-log">' + logHtml + "</div></div>" : "")
      + "</div>"
      + '<div class="modal-foot">'
      + (task ? '<button class="link" id="modalDelete" style="color:var(--danger)">删除任务</button>' : "<span></span>")
      + '<div style="display:flex;gap:var(--space-2)"><button class="btn-secondary" id="modalCancel">取消</button><button class="btn-primary" id="modalSave">' + (isNew ? "创建任务" : "保存") + "</button></div>"
      + "</div>";

    $("#modalOverlay").classList.remove("hidden");
    $("#taskModal").classList.remove("hidden");

    m.querySelectorAll(".step").forEach((el) => {
      el.addEventListener("click", () => {
        if (!task) return;
        const to = parseInt(el.dataset.step, 10);
        if (to === task.status) return;
        task.log.push({ actor: "我", from: statuses[task.status], to: statuses[to], time: nowTime() });
        task.status = to;
        persistTemplates();
        renderTaskModal();
      });
    });
    $("#modalClose").addEventListener("click", closeModal);
    $("#modalCancel").addEventListener("click", closeModal);
    if (task) $("#modalDelete").addEventListener("click", () => { tpl().tasks = tpl().tasks.filter((x) => x.id !== task.id); persistTemplates(); toast("任务已删除"); closeModal(); renderView(); });
    $("#modalSave").addEventListener("click", () => {
      const title = $("#fTitle").value.trim();
      if (!title) { $("#titleField").classList.add("error"); $("#titleField .error-msg").classList.remove("hidden"); $("#fTitle").focus(); return; }
      const due = $("#fDue").value || "今天";
      const publisher = $("#fPublisher").value;
      const handler = $("#fHandler").value;
      const priority = $("#fPriority").value;
      if (isNew) {
        tpl().tasks.unshift({ id: "m" + Date.now(), title: title, desc: $("#fDesc").value.trim(), source: "manual", publisher: publisher, handler: handler, priority: priority, due: due, status: 0, log: [] });
        toast("任务已创建");
      } else {
        task.title = title; task.desc = $("#fDesc").value.trim(); task.publisher = publisher; task.handler = handler; task.priority = priority; task.due = due;
        toast("已保存");
      }
      persistTemplates();
      closeModal();
      renderView(); renderMeta();
    });
  }
  function openTask(id) { state.modalMode = "view"; state.modalTaskId = id; renderTaskModal(); }
  function openNew() { state.modalMode = "create"; state.modalTaskId = null; renderTaskModal(); }
  function closeModal() { $("#modalOverlay").classList.add("hidden"); $("#taskModal").classList.add("hidden"); $("#taskModal").innerHTML = ""; }

  /* ── 导入 Excel ── */
  const IMPORT_ROWS = [
    ["维修 A 座 3 楼渗水", "王师傅", "2026-08-26"],
    ["订购五金配件一批", "李姐", "2026-08-27"],
    ["更新供应商价格表", "我", "2026-08-29"]
  ];
  function renderImportModal() {
    $("#importModal").innerHTML =
      '<div class="modal-head"><div><h2 class="modal-title">导入 Excel</h2><p class="modal-sub">从「本月杂事.xlsx」识别出以下任务</p></div>'
      + '<button class="icon-btn" id="importClose" aria-label="关闭">' + icon("close") + "</button></div>"
      + '<div class="modal-body">'
      + '<table class="preview-table"><thead><tr><th>任务</th><th>处理者</th><th>截止</th></tr></thead><tbody>'
      + IMPORT_ROWS.map((r) => "<tr><td>" + esc(r[0]) + "</td><td>" + esc(r[1]) + "</td><td>" + esc(fmtDue(r[2])) + "</td></tr>").join("")
      + "</tbody></table>"
      + '<p class="field-help">导入后会落到「' + esc(tpl().statuses[0]) + '」列，发布者默认为你，处理者和截止日期已自动识别。</p>'
      + "</div>"
      + '<div class="modal-foot"><span></span><div style="display:flex;gap:var(--space-2)"><button class="btn-secondary" id="importCancel">取消</button><button class="btn-primary" id="importConfirm">导入这 3 条</button></div></div>';
    $("#importOverlay").classList.remove("hidden");
    $("#importModal").classList.remove("hidden");
    $("#importClose").addEventListener("click", closeImport);
    $("#importCancel").addEventListener("click", closeImport);
    $("#importConfirm").addEventListener("click", () => {
      IMPORT_ROWS.forEach((r) => tpl().tasks.unshift({ id: "x" + Date.now() + r[0], title: r[0], desc: "由 Excel 导入。", source: "excel", publisher: "我", handler: r[1], priority: "normal", due: r[2], status: 0, log: [] }));
      persistTemplates();
      toast("已导入 3 条任务");
      closeImport(); renderView();
    });
  }
  function closeImport() { $("#importOverlay").classList.add("hidden"); $("#importModal").classList.add("hidden"); $("#importModal").innerHTML = ""; }

  /* ── toast ── */
  let toastTimer = null;
  function toast(msg) {
    const el = $("#toast");
    el.innerHTML = icon("check") + "<span>" + esc(msg) + "</span>";
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
  }

  /* ── 事件绑定 ── */
  function syncViewToggle() {
    $("#viewToggle").querySelectorAll(".seg-btn").forEach((b) => b.classList.toggle("active", b.dataset.view === state.view));
  }
  function bindStatic() {
    const btn = $("#templateBtn");
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const menu = $("#templateMenu");
      menu.classList.toggle("hidden");
      btn.setAttribute("aria-expanded", menu.classList.contains("hidden") ? "false" : "true");
    });
    document.addEventListener("click", (e) => {
      const menu = $("#templateMenu");
      if (!menu.classList.contains("hidden") && !e.target.closest(".template-switch")) { menu.classList.add("hidden"); $("#templateBtn").setAttribute("aria-expanded", "false"); }
    });
    $("#templateMenu").addEventListener("click", (e) => {
      const del = e.target.closest(".mi-del");
      if (del) { deleteTemplate(del.dataset.del); return; }
      const add = e.target.closest("#newTemplateBtn");
      if (add) { createCustomTemplate(); return; }
      const item = e.target.closest(".menu-item");
      if (!item) return;
      state.templateId = item.dataset.tpl;
      persistState();
      $("#templateMenu").classList.add("hidden");
      $("#templateBtn").setAttribute("aria-expanded", "false");
      renderAll();
    });

    $("#searchInput").addEventListener("input", (e) => { state.query = e.target.value; renderView(); });

    $("#filterChips").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      state.filter = chip.dataset.filter;
      $("#filterChips").querySelectorAll(".chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      renderView();
    });

    $("#viewToggle").addEventListener("click", (e) => {
      const b = e.target.closest(".seg-btn");
      if (!b) return;
      state.view = b.dataset.view;
      syncViewToggle();
      persistState();
      renderView();
    });

    $("#newBtn").addEventListener("click", openNew);
    $("#importBtn").addEventListener("click", renderImportModal);
    $("#editTemplateBtn").addEventListener("click", openTemplateEditor);

    $("#inboxBtn").addEventListener("click", () => { $("#inboxDrawer").classList.add("open"); $("#inboxOverlay").classList.remove("hidden"); });
    function closeInbox() { $("#inboxDrawer").classList.remove("open"); $("#inboxOverlay").classList.add("hidden"); }
    $("#inboxClose").addEventListener("click", closeInbox);
    $("#inboxOverlay").addEventListener("click", closeInbox);
    $("#inboxBody").addEventListener("click", (e) => {
      const c = e.target.closest("[data-confirm]");
      const ig = e.target.closest("[data-ignore]");
      if (c) confirmDraft(c.dataset.confirm);
      if (ig) ignoreDraft(ig.dataset.ignore);
    });

    $("#board").addEventListener("click", (e) => {
      const adv = e.target.closest("[data-advance]");
      if (adv) {
        e.stopPropagation();
        const task = findTask(adv.dataset.advance);
        if (task && task.status < tpl().statuses.length - 1) {
          task.log.push({ actor: "我", from: tpl().statuses[task.status], to: tpl().statuses[task.status + 1], time: nowTime() });
          task.status += 1;
          persistTemplates();
          renderView();
        }
        return;
      }
      const sort = e.target.closest("th.sortable");
      if (sort) { toggleSort(sort.dataset.sort); return; }
      const card = e.target.closest(".card[data-id]");
      if (card) { openTask(card.dataset.id); return; }
      const row = e.target.closest("tr[data-id]");
      if (row && !e.target.closest(".status-select")) { openTask(row.dataset.id); return; }
    });
    $("#board").addEventListener("change", (e) => {
      const sel = e.target.closest(".status-select");
      if (!sel) return;
      const task = findTask(sel.dataset.id);
      const to = parseInt(sel.value, 10);
      if (!task || to === task.status) return;
      task.log.push({ actor: "我", from: tpl().statuses[task.status], to: tpl().statuses[to], time: nowTime() });
      task.status = to;
      persistTemplates();
      renderView();
    });

    $("#modalOverlay").addEventListener("click", closeModal);
    $("#importOverlay").addEventListener("click", closeImport);
    $("#templateOverlay").addEventListener("click", closeTemplateEditor);

    const sw = $("#kwSwitch");
    sw.addEventListener("click", () => {
      const on = sw.getAttribute("aria-checked") !== "true";
      sw.setAttribute("aria-checked", on ? "true" : "false");
      toast(on ? "关键词自动收任务已开启" : "已暂停自动收任务");
    });
    sw.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); sw.click(); } });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closeModal(); closeImport(); closeTemplateEditor(); $("#inboxDrawer").classList.remove("open"); $("#inboxOverlay").classList.add("hidden"); }
    });
  }

  function renderAll() { renderMeta(); renderMenu(); renderView(); renderInbox(); }

  syncViewToggle();
  renderAll();
  bindStatic();
})();
</script>
</body>
</html>
