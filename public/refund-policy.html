<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>退款政策 · BuildTrace 汇办</title>
<style>
:root { --bg:#fafafa; --surface:#fff; --fg:#111; --muted:#6b6b6b; --border:#e5e5e5; --accent:#2f6feb; --radius-md:12px; }
* { box-sizing:border-box; }
body { margin:0; font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--fg); background:var(--bg); line-height:1.75; -webkit-font-smoothing:antialiased; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
.container { max-width:760px; margin:0 auto; padding:48px 24px 80px; }
h1 { font-size:32px; font-weight:600; letter-spacing:-0.01em; margin:0 0 6px; }
.meta { color:var(--muted); font-size:13px; margin:0 0 36px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:36px; }
h2 { font-size:19px; font-weight:600; margin:32px 0 10px; }
h2:first-child { margin-top:0; }
p, li { font-size:15px; color:var(--fg); }
ul { padding-left:20px; margin:8px 0; }
.back { display:inline-block; margin-top:0; font-size:13px; }
.lang-switch { position:fixed; top:16px; right:16px; z-index:20; display:flex; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:3px; }
.lang-switch button { border:none; background:transparent; color:var(--muted); font-size:13px; padding:4px 10px; border-radius:999px; cursor:pointer; font-family:inherit; }
.lang-switch button.active { background:var(--fg); color:var(--surface); }
</style>
</head>
<body>
<div class="lang-switch"><button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button></div>
<div class="container">
  <h1 data-i18n="title">退款政策</h1>
  <p class="meta" data-i18n="meta">BuildTrace（汇办）· 更新日期：2026 年 9 月 27 日</p>

  <div class="card">
    <h2 data-i18n="h1">1. 退款保证</h2>
    <p data-i18n="p1">首次订阅后 <b>30 天内</b>，如对服务不满意，可申请<b>全额退款</b>。</p>

    <h2 data-i18n="h2">2. 取消订阅</h2>
    <p data-i18n="p2">你可随时取消订阅。取消后，本期到期即停止续费，已付费期间仍可正常使用。</p>

    <h2 data-i18n="h3">3. 退款方式</h2>
    <p data-i18n="p3">退款将原路退回原支付方式，通常 5–10 个工作日到账，具体以支付渠道为准。</p>

    <h2 data-i18n="h4">4. 不适用情形</h2>
    <p data-i18n="p4">超过 30 天的订阅原则上不予退款，特殊情况可联系我们协商。</p>

    <h2 data-i18n="h5">5. 联系</h2>
    <p data-i18n-html="p5">申请退款或有疑问，请联系：<a href="mailto:support@buildtrace.org">support@buildtrace.org</a>。</p>
  </div>

  <div style="display:flex; gap:16px; align-items:center; margin-top:24px;">
    <a class="back" href="landing-page.html" data-i18n="back">← 返回首页</a>
    <a class="back" href="terms-of-service.html" data-i18n="terms">服务条款</a>
    <a class="back" href="privacy-policy.html" data-i18n="privacy">隐私政策</a>
  </div>
</div>

<script>
(function () {
  var I18N = {
    zh: {
      "title": "退款政策", "meta": "BuildTrace（汇办）· 更新日期：2026 年 9 月 27 日",
      "h1": "1. 退款保证", "p1": "首次订阅后 <b>30 天内</b>，如对服务不满意，可申请<b>全额退款</b>。",
      "h2": "2. 取消订阅", "p2": "你可随时取消订阅。取消后，本期到期即停止续费，已付费期间仍可正常使用。",
      "h3": "3. 退款方式", "p3": "退款将原路退回原支付方式，通常 5–10 个工作日到账，具体以支付渠道为准。",
      "h4": "4. 不适用情形", "p4": "超过 30 天的订阅原则上不予退款，特殊情况可联系我们协商。",
      "h5": "5. 联系", "p5": "申请退款或有疑问，请联系：<a href=\"mailto:support@buildtrace.org\">support@buildtrace.org</a>。",
      "back": "← 返回首页", "terms": "服务条款", "privacy": "隐私政策"
    },
    en: {
      "title": "Refund Policy", "meta": "BuildTrace · Updated: Sep 27, 2026",
      "h1": "1. Refund guarantee", "p1": "Within <b>30 days</b> of your first subscription, if you're unsatisfied you may request a <b>full refund</b>.",
      "h2": "2. Cancelling", "p2": "You may cancel anytime. After canceling, no renewal occurs once the current period ends; you keep access until then.",
      "h3": "3. How refunds work", "p3": "Refunds go back to the original payment method, typically within 5–10 business days depending on the payment channel.",
      "h4": "4. Exceptions", "p4": "Subscriptions older than 30 days are generally non-refundable; special cases may be discussed with us.",
      "h5": "5. Contact", "p5": "To request a refund or ask questions, contact: <a href=\"mailto:support@buildtrace.org\">support@buildtrace.org</a>.",
      "back": "← Back", "terms": "Terms of Service", "privacy": "Privacy Policy"
    }
  };
  function apply(lang) {
    document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (I18N[lang] && I18N[lang][k] !== undefined) el.textContent = I18N[lang][k];
    });
    document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
      var k = el.getAttribute("data-i18n-html");
      if (I18N[lang] && I18N[lang][k] !== undefined) el.innerHTML = I18N[lang][k];
    });
    document.querySelectorAll("[data-lang]").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-lang") === lang);
    });
    try { localStorage.setItem("lang", lang); } catch (e) {}
  }
  var saved = "zh";
  try { saved = localStorage.getItem("lang") || "zh"; } catch (e) {}
  apply(saved);
  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.addEventListener("click", function () { apply(b.getAttribute("data-lang")); });
  });
})();
</script>
</body>
</html>
