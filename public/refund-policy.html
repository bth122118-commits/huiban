  <h1>退款政策</h1>
  <p class="meta">BuildTrace（汇办）· 更新日期：2026 年 9 月 27 日</p>

  <div class="card">
    <h2>1. 退款保证</h2>
    <p>首次订阅后 <b>30 天内</b>，如对服务不满意，可申请<b>全额退款</b>。</p>

    <h2>2. 取消订阅</h2>
    <p>你可随时取消订阅。取消后，本期到期即停止续费，已付费期间仍可正常使用。</p>

    <h2>3. 退款方式</h2>
    <p>退款将原路退回原支付方式，通常 5–10 个工作日到账，具体以支付渠道为准。</p>

    <h2>4. 不适用情形</h2>
    <p>超过 30 天的订阅原则上不予退款，特殊情况可联系我们协商。</p>

    <h2>5. 联系</h2>
    <p>申请退款或有疑问，请联系：<a href="mailto:support@buildtrace.org">support@buildtrace.org</a>。</p>
